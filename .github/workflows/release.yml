name: Release

# v1.2.3 形式のタグを push すると、署名付き APK をビルドして
# barista9409/calendar-releases に Release と update.json を公開する
# （Actions 画面の「Run workflow」から、バージョンを指定して手動でも実行できる）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン（例: 0.1.0）"
        required: true
      notes:
        description: "更新内容（改行は \\n）。空ならコミット履歴から作成"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASES_REPO: barista9409/calendar-releases
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        env:
          RAW: ${{ inputs.version || github.ref_name }}
        run: |
          VER="${RAW#v}"
          if [[ ! "$VER" =~ ^([0-9]{1,2})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::バージョンは 1.2.3 の形式にしてください（各桁 0-99）: $RAW"; exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          missing=0
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD RELEASES_REPO_TOKEN; do
            if [ -z "${!n}" ]; then echo "::error::Secret $n が未登録です"; missing=1; fi
          done
          exit $missing

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease --console=plain \
            -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"
          APK="calendar-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -5 || true
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Release notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if [ -n "$INPUT_NOTES" ]; then
            printf '%b\n' "$INPUT_NOTES" > notes.md
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && MSG=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN/,$d') \
               && [ -n "$(echo "$MSG" | tr -d '[:space:]')" ]; then
            echo "$MSG" > notes.md
          else
            # 前回リリース時のコミットからの履歴（初回は直近 20 件）
            PREV_SHA=$(gh release view --repo "$RELEASES_REPO" --json body -q .body 2>/dev/null | grep -o 'commit: [0-9a-f]\{40\}' | cut -d' ' -f2 || true)
            if [ -n "$PREV_SHA" ] && git cat-file -e "$PREV_SHA" 2>/dev/null; then
              git log --no-merges --format='・%s' "$PREV_SHA..HEAD" > notes.md
            else
              git log --no-merges -20 --format='・%s' > notes.md
            fi
          fi
          [ -s notes.md ] || echo "・不具合修正と改善" > notes.md
          cat notes.md

      - name: Publish to calendar-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # 空のリポジトリなら README で初期化（Release 作成にはコミットが必要）
          if ! gh api "repos/$RELEASES_REPO/commits?per_page=1" >/dev/null 2>&1; then
            printf '# Calendar releases\n\nCalendar アプリの配布用リポジトリです。アプリはここの update.json を見て更新を確認します。\n' > README.md
            gh api -X PUT "repos/$RELEASES_REPO/contents/README.md" -f message="Initialize releases repository" \
              -f content="$(base64 -w0 README.md)" >/dev/null
          fi
          { cat notes.md; printf '\n<!-- commit: %s -->\n' "$GITHUB_SHA"; } > release-body.md
          # 決まった名前の calendar.apk も置く：…/releases/latest/download/calendar.apk で常に最新版を直接ダウンロードできる
          cp "$APK" calendar.apk
          gh release create "v$VERSION" "$APK" calendar.apk --repo "$RELEASES_REPO" --title "Calendar $VERSION" --notes-file release-body.md --latest
          URL="https://github.com/$RELEASES_REPO/releases/download/v$VERSION/$APK"
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION" --arg url "$URL" --arg sha "$SHA256" \
                --rawfile notes notes.md --arg at "$(date -Iseconds)" \
            '{latest: {versionCode: $code, versionName: $name, minSdk: 26, apkUrl: $url, sha256: $sha,
                       releaseNotes: ($notes | rtrimstr("\n")), mandatory: false, publishedAt: $at}}' > update.json
          cat update.json
          OLD_SHA=$(gh api "repos/$RELEASES_REPO/contents/update.json" --jq .sha 2>/dev/null || true)
          ARGS=(-f message="Release v$VERSION" -f content="$(base64 -w0 update.json)")
          [ -n "$OLD_SHA" ] && ARGS+=(-f sha="$OLD_SHA")
          gh api -X PUT "repos/$RELEASES_REPO/contents/update.json" "${ARGS[@]}" >/dev/null
          echo "Published v$VERSION"
